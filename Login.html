<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>(function(){try{var t=localStorage.getItem('ip-theme')||'light';document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<title>Log in — InkPrinted</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="theme.css" />
<style>
  /* Color tokens live in theme.css. Only layout vars stay here. */
  :root {
    --content-max: 1200px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter Tight", system-ui, -apple-system, sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    font-size: 16px;
    line-height: 26px;
  }
  body { overflow-x: hidden; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }
  img, svg { display: block; max-width: 100%; }
  input { font-family: inherit; outline: none; }

  .label-up { font-size: 11px; line-height: 14px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500; }
  .container {
    max-width: var(--content-max);
    margin: 0 auto;
    padding: 0 24px;
  }
  @media (min-width: 1280px) { .container { padding: 0 24px; } }
  @media (max-width: 720px) { .container { padding: 0 16px; } }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 48px; padding: 0 24px;
    border-radius: 4px;
    font-weight: 500; font-size: 15px;
    transition: filter 200ms ease-out, background 200ms ease-out, border-color 200ms ease-out, transform 200ms ease-out;
    white-space: nowrap;
  }
  .btn .arrow { transition: transform 200ms ease-out; }
  .btn:hover .arrow { transform: translateX(3px); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { filter: brightness(1.05); }

  input.fld {
    width: 100%;
    height: 44px;
    background: transparent;
    color: var(--text);
    border: 0.5px solid var(--text-25);
    border-radius: 4px;
    padding: 0 12px;
    font-size: 14px;
    transition: border-color 200ms ease-out;
  }
  input.fld:focus { border-color: var(--accent-line); border-width: 1px; }
  input.fld::placeholder { color: var(--text-30); }

  /* Subtle textured noise behind the brand panel for editorial feel */
  .grain {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 10% 20%, rgba(236,90,180,0.03), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(255,255,255,0.02), transparent 50%);
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="placeholders.jsx"></script>
<script type="text/babel" src="login-app.jsx"></script>
</body>
</html>
