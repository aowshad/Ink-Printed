<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Crop top — InkPrinted</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0A0A0A;
    --bg-deeper: #000000;
    --accent: #AACC00;
    --text: #FFFFFF;
    --text-65: rgba(255,255,255,0.65);
    --text-60: rgba(255,255,255,0.60);
    --text-50: rgba(255,255,255,0.50);
    --text-40: rgba(255,255,255,0.40);
    --text-30: rgba(255,255,255,0.30);
    --text-25: rgba(255,255,255,0.25);
    --text-20: rgba(255,255,255,0.20);
    --text-15: rgba(255,255,255,0.15);
    --text-10: rgba(255,255,255,0.10);
    --surface: #141414;
    --surface-2: #1C1C1C;
    --surface-hover: #1C1C1C;
    --border: #1C1C1C;
    --content-max: 1280px;
    --gutter: 96px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter Tight", system-ui, -apple-system, sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    font-size: 16px;
    line-height: 26px;
  }
  body { overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }
  img, svg { display: block; max-width: 100%; }

  .label-up {
    font-size: 11px;
    line-height: 14px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .eyebrow {
    font-size: 12px;
    line-height: 16px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
  }
  .h2 { font-size: 48px; line-height: 56px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }

  .container {
    max-width: var(--content-max);
    margin: 0 auto;
    padding: 0 var(--gutter);
  }
  @media (max-width: 1440px) { .container { padding: 0 64px; } }
  @media (max-width: 900px) { :root { --gutter: 16px; } .container { padding: 0 16px; } }

  .reveal {
    opacity: 1;
    transform: none;
    transition: opacity 600ms ease-out, transform 600ms ease-out;
  }
  .js-reveal-ready .reveal:not(.in) {
    opacity: 0;
    transform: translateY(16px);
  }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 48px; padding: 0 24px;
    border-radius: 4px;
    font-weight: 500; font-size: 15px;
    transition: background 200ms ease-out, border-color 200ms ease-out, transform 200ms ease-out, color 200ms ease-out, filter 200ms ease-out;
    white-space: nowrap;
  }
  .btn .arrow { transition: transform 200ms ease-out; }
  .btn:hover .arrow { transform: translateX(3px); }
  .btn-primary { background: var(--accent); color: #0A0A0A; }
  .btn-primary:hover { filter: brightness(1.05); }
  .btn-primary:active { transform: translate(0,1px); }
  .btn-secondary {
    background: transparent; color: #fff;
    border: 1px solid rgba(255,255,255,0.30);
  }
  .btn-secondary:hover { border-color: rgba(255,255,255,0.65); background: rgba(255,255,255,0.04); }
  .btn-invert { background: #0A0A0A; color: var(--accent); }
  .btn-invert:hover { background: #1c1c1c; }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  .ph {
    background-color: #161616;
    background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 14px);
    position: relative;
    overflow: hidden;
  }
  .ph-tag {
    position: absolute;
    left: 12px; bottom: 12px;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; letter-spacing: 0.04em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 4px 6px;
    border-radius: 2px;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="placeholders.jsx"></script>
<script type="text/babel" src="megamenus.jsx"></script>
<script type="text/babel" src="top.jsx"></script>
<script type="text/babel" src="bottom.jsx"></script>
<script type="text/babel" src="cart-data.jsx"></script>
<script type="text/babel" src="cart-drawer.jsx"></script>
<script type="text/babel" src="pdp-gallery.jsx"></script>
<script type="text/babel" src="pdp-info.jsx"></script>
<script type="text/babel" src="pdp-below.jsx"></script>
<script type="text/babel" src="pdp-app.jsx"></script>
</body>
</html>
